<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo</title>
  <style>
    :root { --page: #edf2f7; --ink: #172033; --blue: #2563eb; --panel: #fff; }
    html, body { margin: 0; padding: 0; background: var(--page); color: var(--ink); }
    body { font-family: TkDefaultFont, sans-serif; }
    .shell { max-width: 820px; margin: 26px auto; padding: 0 18px 32px; }
    .hero { background: #172554; color: white; padding: 25px; border: 1px solid #263a77; border-radius: 16px; }
    .hero h1 { margin: 0 0 7px; }
    .hero p { margin: 0; color: #dbeafe; line-height: 1.45; }
    .card { background: var(--panel); border: 1px solid #d1d9e6; padding: 19px; margin-top: 14px; border-radius: 14px; }
    .row { display: flex; flex-wrap: nowrap; gap: 9px; align-items: center; margin: 12px 0; }
    button { background: var(--blue); color: white; border: 0; border-radius: 8px; padding: 9px 13px; }
    #count { font-size: 28px; font-weight: 700; color: var(--blue); }
    #status { color: #475569; }
    .notice { background: #ecfeff; border: 1px solid #a5f3fc; border-radius: 8px; padding: 12px; margin-top: 13px; }
    .accent { background: #dbeafe; }
    input, select { font-size: 15px; padding: 7px; width: 300px; border: 1px solid #94a3b8; border-radius: 7px; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>WebCat</h1>
    </section>
    <section class="card">
      <div class="row">
        <button id="add">Increment</button>
        <button id="reset">Reset</button>
        <button id="hello">Alert</button>
        <button id="theme">Toggle card</button>
      </div>
      <p>Count: <span id="count">0</span></p>
      <p id="status">Waiting for JavaScript…</p>
    </section>
    <section id="card2" class="card">
      <h2>DOM + forms</h2>
      <label for="name">Name</label><br>
      <input id="name" placeholder="Type something">
      <br>
      <label for="choice">choose</label><br>
      <select id="choice">
        <option>1</option>
        <option>2t</option>
        <option>3</option>
      </select>
      <div class="row">
        <button id="addNote">Button</button>
      </div>
      <div id="notes"></div>
      <div class="notice">You can open this in regular browser too because you can</div>
    </section>
  </main>
  <script>
    let count = 0;
    document.addEventListener('DOMContentLoaded', () => {
      const countEl = document.getElementById('count');
      const statusEl = document.getElementById('status');
      const card = document.getElementById('card2');
      const name = document.getElementById('name');
      const choice = document.getElementById('choice');
      statusEl.textContent = 'Javascript works';
      document.getElementById('add').addEventListener('click', () => { count += 1; countEl.textContent = String(count); });
      document.getElementById('reset').addEventListener('click', () => { count = 0; countEl.textContent = '0'; });
      document.getElementById('hello').addEventListener('click', () => alert('Test'));
      document.getElementById('theme').addEventListener('click', () => card.classList.toggle('accent'));
      name.addEventListener('input', () => statusEl.textContent = '1 ' + name.value);
      choice.addEventListener('change', () => statusEl.textContent = '1 ' + choice.value);
      document.getElementById('addNote').addEventListener('click', () => {
        const note = document.createElement('p');
        note.textContent = '' + new Date().getTime();
        document.getElementById('notes').appendChild(note);
      });
    });
  </script>
</body>
</html>
